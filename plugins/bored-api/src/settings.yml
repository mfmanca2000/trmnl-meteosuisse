---
strategy: polling
no_screen_padding: "no"
dark_mode: "no"
static_data: ""
polling_verb: get
polling_url: "https://trmnl-plugins-mfmanca-server.vercel.app/api/bored-api/activity?type={{type}}&participants={{participants}}"
polling_headers: ""
id: 50003
custom_fields:
  - keyname: "type"
    field_type: select
    options:
    - "education"
    - "recreational"
    - "social"
    - "charity"
    - "cooking"
    - "relaxation"
    - "busywork"
    - "diy"
    default: ""    
    name: "Activity type"
    description: "Optional filter. One of: education, recreational, social, charity, cooking, relaxation, busywork, diy. Leave blank for any."
    placeholder: "e.g. recreational"
  - keyname: "participants"
    field_type: select
    options:
    - "1"
    - "2"
    - "3"
    - "4"
    - "5"
    - "6"
    - "8"
    default: ""
    name: "Participants"
    description: "Optional filter. Number of people: 1, 2, 3, 4, 5, 6 or 8. Leave blank for any."
    placeholder: "e.g. 2"
  - keyname: doesnt_matter
    name: About This Plugin
    category: life,personal
    field_type: author_bio
    description: Bored is built upon the Bored API available at https://bored-api.appbrewery.com/. Copyright © The App Brewery
    email_address: mfmanca2000@hotmail.com
name: "Bored API"
refresh_interval: 60
